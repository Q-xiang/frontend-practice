    <h1>我的家乡--昆明</h1>

    <h2>春城概览</h2>
    <p>昆明坐落于云贵高原中部，是云南省的省会城市，举世闻名的“春城”。这里海拔适中，受季风气候影响，全年气温温差很小，冬天不寒冷，夏天不酷热，一年四季草木常青，鲜花常开不败。走在城市街头，随处都能见到盛放的鲜花，鲜花已经成为这座城市独有的城市印记。</p >
    <p>昆明不仅拥有秀丽的自然风光，也沉淀了深厚的历史人文。这里是古代滇文化的发源地，也是近代西南联大的所在地。城市既有繁华热闹的现代商圈，也保留着充满烟火气息的老街巷。每到冬季，成千上万只红嘴鸥跨越千里来到昆明过冬，人和鸟类和谐共处，成为昆明一道温暖的风景线。</p >
